The **404 File Not Found** error from GitHub Pages means one of two things is happening:

1. **Browser Cache:** Your browser is holding onto the old 404 page from before your site finished deploying.
2. **Missing `.nojekyll` File:** GitHub Pages by default tries to process sites using Jekyll. Jekyll ignores folders starting with an underscore (like `_static` or `_build` generated by MyST/Jupyter Book), which blocks `index.html` from loading properly.

---

### 🧪 Step 1: Rule Out Browser Cache (Quick Check)

Before modifying any code, try viewing the URL in an isolated tab:

* Open **Incognito / Private Window** in your browser.
* Visit: **`[https://raulcontreraso-bit.github.io/Web_Courses_Vault/](https://raulcontreraso-bit.github.io/Web_Courses_Vault/)`**
* Or press **`Ctrl + Shift + R`** (or `Cmd + Shift + R` on Mac) to force-refresh the page and clear local cache.

---

### 🛠️ Step 2: Add `.nojekyll` to your Repository

If clearing cache doesn't resolve it, adding a `.nojekyll` file tells GitHub Pages to serve your raw HTML without running Jekyll filters.

1. In your local repository (`Web_Courses_Vault`), create an empty file named exactly **`.nojekyll`** in the root directory (alongside `myst.yml` and `README.md`).
2. Also update your `.github/workflows/deploy.yml` step to ensure `.nojekyll` gets included in the `gh-pages` build:

```yaml
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          keep_files: false
          force_orphan: true

```

3. Commit and push the changes:

```powershell
New-Item -ItemType File -Name ".nojekyll" -Force
git add .
git commit -m "Add .nojekyll to disable Jekyll processing on GitHub Pages"
git push

```

